{% extends "base.html" %}

{% block title %}{{ action }} Customer - LogiTrack{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card border-0 shadow-sm kpi-card">
            <div class="card-header bg-primary text-white py-3" style="border-radius: 12px 12px 0 0;">
                <h5 class="mb-0 fw-bold"><i class="fa-solid fa-user-plus me-2 text-warning"></i>{{ action }} Customer Account</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% if action == "Add" %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    {% else %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" class="form-control" value="{{ customer.user.username }}" disabled>
                    </div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ customer.user.email if customer else '' }}" placeholder="Enter email (@gmail.com or @logitrack.com)" pattern="[a-zA-Z0-9._%+-]+@(gmail\.com|logitrack\.com)" title="Email domain must be @gmail.com or @logitrack.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}" placeholder="Enter 10-digit phone" pattern="[0-9]{10}" maxlength="10" title="Phone number must contain exactly 10 digits (0-9)" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Account Status</label>
                            <select name="status" class="form-select">
                                <option value="Active" {% if customer and customer.status == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Suspended" {% if customer and customer.status == 'Suspended' %}selected{% endif %}>Suspended</option>
                            </select>
                        </div>
                        {% if action == "Edit" %}
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Loyalty Points</label>
                            <input type="number" name="loyalty_points" class="form-control" value="{{ customer.loyalty_points }}" min="0">
                        </div>
                        {% endif %}
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">{% if action == "Edit" %}Update Password (Leave blank to keep current){% else %}Account Password{% endif %}</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" minlength="4" pattern="(?=.*\d)(?=.*[^a-zA-Z0-9\s]).{4,}" title="Password must be at least 4 characters and contain at least 1 digit and 1 special character" {% if action == "Add" %}required{% endif %}>
                    </div>

                    {% if action == "Add" %}
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" minlength="4" required>
                    </div>
                    {% endif %}

                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <button type="submit" class="btn btn-primary flex-fill py-2 fw-bold"><i class="fa-solid fa-circle-check me-2"></i>Save Customer</button>
                        <a href="{{ url_for('admin.list_customers') }}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
