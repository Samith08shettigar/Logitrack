{% extends "base.html" %}

{% block public_content %}
<div class="auth-bg py-5 position-relative overflow-hidden">
    <div class="genz-glow-orb-1"></div>
    <div class="genz-glow-orb-2"></div>
    <div class="container position-relative" style="z-index: 2;">
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="col-md-6 col-lg-5">
                <div class="text-center text-white mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-15 text-warning mb-3 shadow-lg" style="border: 1px solid rgba(245, 158, 11, 0.3);">
                        <i class="fa-solid fa-truck-ramp-box fa-2x"></i>
                    </div>
                    <h2 class="fw-bold font-brand mb-1">Welcome to LogiTrack</h2>
                    <p class="text-white-50 small">Enter your credentials to access your control panel</p>
                </div>
                
                <div class="card border-0 glass-card shadow-lg" style="border-radius: 20px; border: 1px solid rgba(255,255,255,0.15) !important;">
                    <div class="card-body p-4 p-sm-5">
                        <form method="POST" action="{{ url_for('auth.login') }}">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" name="username" class="form-control bg-light border-start-0" placeholder="Enter username or email" required autocomplete="username">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label class="form-label small fw-bold mb-0">Password</label>
                                    <a href="{{ url_for('auth.reset_password') }}" class="small text-decoration-none text-primary fw-bold">Forgot Password?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                                    <input type="password" name="password" id="login_password" class="form-control bg-light border-start-0 border-end-0" placeholder="Enter password" required autocomplete="current-password">
                                    <button class="btn btn-light bg-light border border-start-0 text-muted" type="button" onclick="togglePasswordVisibility('login_password', 'login_eye_icon')" title="Show / Hide Password">
                                        <i class="fa-solid fa-eye" id="login_eye_icon"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" style="border-radius: 12px;"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In to Dashboard</button>
                        </form>
                        
                        <div class="text-center mt-4 border-top pt-3">
                            <span class="small text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-bold text-decoration-none text-primary ms-1">Create Account &rarr;</a></span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
