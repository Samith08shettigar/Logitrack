{% extends "base.html" %}

{% block title %}{{ action }} Address - LogiTrack{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card border-0 shadow-sm kpi-card">
            <div class="card-header bg-primary text-white py-3" style="border-radius: 12px 12px 0 0;">
                <h5 class="mb-0 fw-bold"><i class="fa-solid fa-map-location-dot me-2 text-warning"></i>{{ action }} Saved Address</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Address Label</label>
                        <input type="text" name="label" class="form-control" placeholder="e.g. Home, Office, Warehouse A" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Street Address</label>
                        <input type="text" name="address_line" class="form-control" placeholder="Enter street name, apt number" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-5">
                            <label class="form-label small fw-bold">City <span class="text-danger">*</span></label>
                            <input type="text" name="city" id="addr_city" class="form-control" placeholder="Enter city/town" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">State <span class="text-danger">*</span></label>
                            <select name="state" id="addr_state" class="form-select" required>
                                <option value="" disabled selected>-- State --</option>
                                {% for s in serviced_states %}
                                    <option value="{{ s }}">{{ s }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Zip Code <span class="text-danger">*</span></label>
                            <input type="text" name="zip_code" id="addr_zip_code" class="form-control" placeholder="6-digit Zip" pattern="[0-9]{6}" maxlength="6" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Contact Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="10-digit contact number" pattern="[0-9]{10}" maxlength="10" title="Phone number must contain exactly 10 digits (0-9)" required>
                    </div>

                    <div class="row mb-4">
                        <div class="col-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_pickup" id="is_pickup" checked>
                                <label class="form-check-label small fw-bold" for="is_pickup">Use for Pickup</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_delivery" id="is_delivery" checked>
                                <label class="form-check-label small fw-bold" for="is_delivery">Use for Delivery</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-circle-check me-2"></i>Save Address</button>
                        <a href="{{ url_for('customer.list_addresses') }}" class="btn btn-outline-secondary w-50">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
